project:
  type: book
  output-dir: docs

book:
  title: "Python Essentials with Hands-On Projects"
  subtitle: "A Top-Down Approach for Programming Aspirants"
  author: "Shravan Kumar"

  site-url: "https://shravankumar147.github.io/python-essentials-book/"
  repo-url: "https://github.com/shravankumar147/python-essentials-book"

  repo-actions:
    - edit
    - issue

  chapters:
    - preface.qmd
    - index.qmd
    - chapters/chapter1.qmd

  sidebar:
    style: floating
    search: true

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    css: /assets/styles.css

execute:
  freeze: auto